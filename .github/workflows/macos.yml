name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build arm64 app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and icon
        run: make project
      - name: Build
        run: xcodebuild -project Lunarium.xcodeproj -scheme Lunarium -configuration Debug -sdk macosx -arch arm64 CODE_SIGNING_ALLOWED=NO build
