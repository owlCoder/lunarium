name: Lunarium
options:
  bundleIdPrefix: io.github.owlCoder
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Lunarium:
    type: application
    platform: macOS
    sources:
      - path: Lunarium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.owlCoder.Lunarium
        PRODUCT_NAME: Lunarium
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: Lunarium/Info.plist
      properties:
        CFBundleDisplayName: Lunarium
        CFBundleName: Lunarium
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSScreenCaptureUsageDescription: "Lunarium captures a screen region only when you invoke it."
        NSPrincipalClass: NSApplication
