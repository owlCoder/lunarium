name: Lunarium
options:
  bundleIdPrefix: io.github.owlCoder
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Lunarium:
    type: application
    platform: macOS
    sources:
      - path: Lunarium
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.owlCoder.Lunarium
        PRODUCT_NAME: Lunarium
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: Lunarium/Info.plist
      properties:
        CFBundleDisplayName: Lunarium
        CFBundleName: Lunarium
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSScreenCaptureUsageDescription: "Lunarium captures a screen region only when you invoke it."
        NSPrincipalClass: NSApplication
        CFBundleLocalizations:
          - en
          - sr-Latn

  LunariumTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LunariumTests
    dependencies:
      - target: Lunarium
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lunarium.app/Contents/MacOS/Lunarium"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
  LunariumUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: LunariumUITests
    dependencies:
      - target: Lunarium
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lunarium:
    build:
      targets:
        Lunarium: all
    test:
      targets:
        - LunariumTests
        - LunariumUITests
